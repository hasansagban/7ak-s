function Icon({ children, size = 15, color, ...rest }) {
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke={color || "currentColor"}
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      {...rest}
    >
      {children}
    </svg>
  );
}

const STORAGE_PREFIX = "antrenman-karnesi:";

function usePersistentState(key, initialValue) {
  const [state, setState] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_PREFIX + key);
      return raw !== null ? JSON.parse(raw) : initialValue;
    } catch {
      return initialValue;
    }
  });
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(state));
    } catch {
      /* depolama kullanılamıyor olabilir, sessizce yok say */
    }
  }, [key, state]);
  return [state, setState];
}

function computeBodyFat(gender, neck, waist, hip, heightCm) {
  if (!neck || !waist || !heightCm) return null;
  try {
    if (gender === "erkek") {
      const diff = waist - neck;
      if (diff <= 0) return null;
      return (
        495 /
          (1.0324 - 0.19077 * Math.log10(diff) + 0.15456 * Math.log10(heightCm)) -
        450
      );
    } else {
      if (!hip) return null;
      const diff = waist + hip - neck;
      if (diff <= 0) return null;
      return (
        495 /
          (1.29579 - 0.35004 * Math.log10(diff) + 0.221 * Math.log10(heightCm)) -
        450
      );
    }
  } catch {
    return null;
  }
}

function computeBMR(gender, weightKg, heightCm, age) {
  const base = 10 * weightKg + 6.25 * heightCm - 5 * age;
  return gender === "erkek" ? base + 5 : base - 161;
}

function round(n, d = 0) {
  const m = Math.pow(10, d);
  return Math.round(n * m) / m;
}

function Onboarding({ onComplete }) {
  const [step, setStep] = useState(0);
  const [form, setForm] = useState({
    gender: "erkek",
    age: "",
    heightCm: "",
    activity: "orta",
    weight: "",
    neck: "",
    waist: "",
    hip: "",
    label: "Başlangıç",
  });
  const [err, setErr] = useState("");

  function next() {
    if (step === 1) {
      if (!form.age || !form.heightCm) {
        setErr("Yaş ve boy bilgisi gerekli.");
        return;
      }
    }
    if (step === 2) {
      if (!form.weight || !form.neck || !form.waist) {
        setErr("Kilo, boyun ve bel ölçüsü gerekli.");
        return;
      }
      if (form.gender === "kadın" && !form.hip) {
        setErr("Kadın vücut yağ hesabı için kalça ölçüsü gerekli.");
        return;
      }
    }
    setErr("");
    setStep((s) => s + 1);
  }
  function back() {
    setErr("");
    setStep((s) => Math.max(0, s - 1));
  }
  function finish() {
    onComplete({
      profile: {
        gender: form.gender,
        age: parseInt(form.age) || 0,
        heightCm: parseFloat(form.heightCm) || 0,
        activity: form.activity,
      },
      bodyLog: {
        id: Date.now(),
        label: form.label || "Başlangıç",
        weight: parseFloat(form.weight) || 0,
        neck: parseFloat(form.neck) || 0,
        waist: parseFloat(form.waist) || 0,
        hip: form.hip ? parseFloat(form.hip) : null,
      },
    });
  }

  const TOTAL = 4;

  return (
    <div className="onboard-wrap">
      <div className="onboard-dots">
        {Array.from({ length: TOTAL }).map((_, i) => (
          <div key={i} className={"dot" + (i === step ? " active" : i < step ? " done" : "")} />
        ))}
      </div>

      <div className="card onboard-card">
        {step === 0 && (
          <div>
            <p className="card-title">Hoş geldin</p>
            <p style={{ fontSize: 14, lineHeight: 1.6 }}>
              Bu, senin antrenman, beslenme ve vücut takibini tutacağın kişisel karnen. Önce birkaç
              temel bilgi alalım, sonra sana sekmeleri kısaca tanıtayım. Tüm veriler telefonunda kalır.
            </p>
            <button className="btn red" onClick={next}>Başlayalım <ArrowRight size={14} /></button>
          </div>
        )}

        {step === 1 && (
          <div>
            <p className="card-title">Profil Bilgileri</p>
            <div className="onboard-field">
              <label>Cinsiyet</label>
              <select className="select" value={form.gender} onChange={(e) => setForm({ ...form, gender: e.target.value })}>
                <option value="erkek">Erkek</option>
                <option value="kadın">Kadın</option>
              </select>
            </div>
            <div className="onboard-field">
              <label>Yaş</label>
              <input className="input" type="number" value={form.age} onChange={(e) => setForm({ ...form, age: e.target.value })} placeholder="örn. 24" />
            </div>
            <div className="onboard-field">
              <label>Boy (cm)</label>
              <input className="input" type="number" value={form.heightCm} onChange={(e) => setForm({ ...form, heightCm: e.target.value })} placeholder="örn. 178" />
            </div>
            <div className="onboard-field">
              <label>Aktivite Düzeyi</label>
              <select className="select" value={form.activity} onChange={(e) => setForm({ ...form, activity: e.target.value })}>
                {Object.entries(ACTIVITY_FACTORS).map(([k, v]) => (
                  <option key={k} value={k}>{v.label}</option>
                ))}
              </select>
            </div>
            {err && <p className="onboard-err">{err}</p>}
            <div className="onboard-nav">
              <button className="btn ghost" onClick={back}><ArrowLeft size={14} /> Geri</button>
              <button className="btn red" onClick={next}>İleri <ArrowRight size={14} /></button>
            </div>
          </div>
        )}

        {step === 2 && (
          <div>
            <p className="card-title">İlk Vücut Ölçümün</p>
            <p style={{ fontSize: 12.5, color: "var(--graphite)", marginTop: -6 }}>
              Bu ölçümlerle vücut yağ oranı, BMR ve makro hedeflerini hesaplayacağız.
            </p>
            <div className="onboard-field">
              <label>Ölçüm etiketi</label>
              <input className="input" style={{ width: "100%" }} value={form.label} onChange={(e) => setForm({ ...form, label: e.target.value })} placeholder="örn. Ağustos" />
            </div>
            <div className="onboard-field">
              <label>Kilo (kg)</label>
              <input className="input" type="number" value={form.weight} onChange={(e) => setForm({ ...form, weight: e.target.value })} />
            </div>
            <div className="onboard-field">
              <label>Boyun (cm)</label>
              <input className="input" type="number" value={form.neck} onChange={(e) => setForm({ ...form, neck: e.target.value })} />
            </div>
            <div className="onboard-field">
              <label>Bel (cm)</label>
              <input className="input" type="number" value={form.waist} onChange={(e) => setForm({ ...form, waist: e.target.value })} />
            </div>
            {form.gender === "kadın" && (
              <div className="onboard-field">
                <label>Kalça (cm)</label>
                <input className="input" type="number" value={form.hip} onChange={(e) => setForm({ ...form, hip: e.target.value })} />
              </div>
            )}
            {err && <p className="onboard-err">{err}</p>}
            <div className="onboard-nav">
              <button className="btn ghost" onClick={back}><ArrowLeft size={14} /> Geri</button>
              <button className="btn red" onClick={next}>İleri <ArrowRight size={14} /></button>
            </div>
          </div>
        )}

        {step === 3 && (
          <div>
            <p className="card-title">Nasıl Çalışır</p>
            <ul className="onboard-tip-list">
              <li><b>Özet</b> — günlük hedeflerin ve haftalık durumun tek bakışta.</li>
              <li><b>Antrenman</b> — hangi bölgeyi hangi gün çalıştığını işaretle, hareket alternatiflerine bak.</li>
              <li><b>Vücut Analizi</b> — her ay ölçüm ekle, yağ oranı ve makrolar otomatik güncellensin.</li>
              <li><b>Beslenme</b> — öğün alternatiflerinden seç, supplement'lerini işaretle.</li>
              <li><b>Cardio</b> — seans ekle, haftalık kalori hedefini takip et.</li>
            </ul>
            <div className="onboard-nav">
              <button className="btn ghost" onClick={back}><ArrowLeft size={14} /> Geri</button>
              <button className="btn red" onClick={finish}>Uygulamaya Başla <ArrowRight size={14} /></button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function SporcuApp() {
  const [tab, setTab] = useState("ozet");

  const [onboardingDone, setOnboardingDone] = usePersistentState("onboardingDone", false);

  const [profile, setProfile] = usePersistentState("profile", DEFAULT_PROFILE);
  const [bodyLogs, setBodyLogs] = usePersistentState("bodyLogs", []);
  const [newLog, setNewLog] = useState({ label: "", weight: "", neck: "", waist: "", hip: "" });

  const [weeklyPlan, setWeeklyPlan] = usePersistentState("weeklyPlan", emptyWeeklyPlan());
  const [activeRegion, setActiveRegion] = useState("Göğüs");

  const [supplementLog, setSupplementLog] = usePersistentState("supplementLog", emptySupplementLog());

  const [cardioLogs, setCardioLogs] = usePersistentState("cardioLogs", []);
  const [newCardio, setNewCardio] = useState({ day: "Pzt", type: "Koşu", minutes: 30 });
  const [cardioGoal, setCardioGoal] = usePersistentState("cardioGoal", 1000);

  const [mealSelections, setMealSelections] = usePersistentState("mealSelections", emptyMealSelections());

  const [resetArmed, setResetArmed] = useState(false);

  /* ---- türetilmiş değerler ---- */

  const latestLog = bodyLogs[bodyLogs.length - 1];
  const prevLog = bodyLogs.length > 1 ? bodyLogs[bodyLogs.length - 2] : null;

  const bodyFatNow = latestLog
    ? computeBodyFat(profile.gender, latestLog.neck, latestLog.waist, latestLog.hip, profile.heightCm)
    : null;
  const bodyFatPrev = prevLog
    ? computeBodyFat(profile.gender, prevLog.neck, prevLog.waist, prevLog.hip, profile.heightCm)
    : null;

  const bmr = latestLog ? computeBMR(profile.gender, latestLog.weight, profile.heightCm, profile.age) : 0;
  const tdee = bmr * (ACTIVITY_FACTORS[profile.activity]?.factor || 1.2);

  const macros = useMemo(() => {
    if (!latestLog) return { proteinG: 0, fatG: 0, carbG: 0 };
    const proteinG = latestLog.weight * 1.8;
    const proteinKcal = proteinG * 4;
    const fatKcal = tdee * 0.25;
    const fatG = fatKcal / 9;
    const carbKcal = Math.max(tdee - proteinKcal - fatKcal, 0);
    const carbG = carbKcal / 4;
    return { proteinG, fatG, carbG };
  }, [latestLog, tdee]);

  const regionCounts = REGIONS.map((r) => ({
    region: r,
    count: DAYS.filter((d) => weeklyPlan[d].includes(r)).length,
  }));
  const dayTotals = DAYS.map((d) => weeklyPlan[d].length);
  const anyTraining = regionCounts.some((r) => r.count > 0);
  const mostTrained = anyTraining ? [...regionCounts].sort((a, b) => b.count - a.count)[0] : null;
  const leastTrainedList = anyTraining ? regionCounts.filter((r) => r.count === 0) : [];

  const weightKgForCardio = latestLog ? latestLog.weight : 75;
  const cardioWithCalories = cardioLogs.map((s) => ({
    ...s,
    kcal: round((CARDIO_TYPES[s.type] * 3.5 * weightKgForCardio) / 200 * s.minutes),
  }));
  const cardioWeekTotal = cardioWithCalories.reduce((sum, s) => sum + s.kcal, 0);
  const cardioPct = cardioGoal > 0 ? Math.min(100, round((cardioWeekTotal / cardioGoal) * 100)) : 0;

  const selectedMealTotals = useMemo(() => {
    let kcal = 0, p = 0, c = 0, f = 0;
    Object.entries(mealSelections).forEach(([slot, idx]) => {
      const m = idx !== null && idx !== undefined ? MEALS[slot][idx] : null;
      if (m) {
        kcal += m.kcal; p += m.p; c += m.c; f += m.f;
      }
    });
    return { kcal, p, c, f };
  }, [mealSelections]);

  /* ---- yardımcı işlevler ---- */

  function toggleRegionDay(day, region) {
    setWeeklyPlan((prev) => {
      const cur = prev[day];
      const next = cur.includes(region) ? cur.filter((r) => r !== region) : [...cur, region];
      return { ...prev, [day]: next };
    });
  }

  function toggleSupplementDay(sup, day) {
    setSupplementLog((prev) => {
      const cur = prev[sup];
      const next = cur.includes(day) ? cur.filter((d) => d !== day) : [...cur, day];
      return { ...prev, [sup]: next };
    });
  }

  function addBodyLog() {
    if (!newLog.label || !newLog.weight || !newLog.neck || !newLog.waist) return;
    setBodyLogs((prev) => [
      ...prev,
      {
        id: Date.now(),
        label: newLog.label,
        weight: parseFloat(newLog.weight),
        neck: parseFloat(newLog.neck),
        waist: parseFloat(newLog.waist),
        hip: newLog.hip ? parseFloat(newLog.hip) : null,
      },
    ]);
    setNewLog({ label: "", weight: "", neck: "", waist: "", hip: "" });
  }

  function addCardio() {
    setCardioLogs((prev) => [
      ...prev,
      { id: Date.now(), day: newCardio.day, type: newCardio.type, minutes: parseInt(newCardio.minutes) || 0 },
    ]);
  }

  function removeCardio(id) {
    setCardioLogs((prev) => prev.filter((s) => s.id !== id));
  }

  function stampLevel(count) {
    if (count === 0) return 0;
    if (count === 1) return 1;
    if (count === 2) return 2;
    return 3;
  }

  function handleOnboardingComplete({ profile: p, bodyLog }) {
    setProfile(p);
    setBodyLogs([bodyLog]);
    setOnboardingDone(true);
  }

  function handleResetClick() {
    if (!resetArmed) {
      setResetArmed(true);
      setTimeout(() => setResetArmed(false), 3000);
      return;
    }
    setResetArmed(false);
    setProfile(DEFAULT_PROFILE);
    setBodyLogs([]);
    setWeeklyPlan(emptyWeeklyPlan());
    setSupplementLog(emptySupplementLog());
    setCardioLogs([]);
    setCardioGoal(1000);
    setMealSelections(emptyMealSelections());
    setOnboardingDone(false);
  }

  function toggleTheme() {
    setTheme((t) => (t === "dark" ? "light" : "dark"));
  }

  /* ------------------------------------------------------------------ */
  return (
    <div className="shell" data-theme={theme}>
      <style>{APP_CSS}</style>

      {!onboardingDone ? (
        <>
          <div className="masthead onboard-masthead">
            <div>
              <h1>Antrenman Karnesi</h1>
              <div className="sub">Kurulum</div>
            </div>
            <button className="theme-btn" onClick={toggleTheme} aria-label="Tema değiştir">
              {theme === "dark" ? <Sun size={16} /> : <Moon size={16} />}
            </button>
          </div>
          <Onboarding onComplete={handleOnboardingComplete} />
        </>
      ) : (
        <>
          <div className="masthead">
            <div>
              <h1>Antrenman Karnesi</h1>
              <div className="sub">Haftalık Takip Sistemi</div>
            </div>
            <div className="masthead-actions">
              <button className="ghost-link" onClick={handleResetClick}>
                {resetArmed ? "Emin misin? Tekrar dokun" : "Sıfırla"}
              </button>
              <button className="theme-btn" onClick={toggleTheme} aria-label="Tema değiştir">
                {theme === "dark" ? <Sun size={16} /> : <Moon size={16} />}
              </button>
            </div>
          </div>

          <div className="tab-nav">
            {TABS.map((t) => {
              const TabIcon = t.icon;
              return (
                <button
                  key={t.id}
                  className={"tab-btn" + (tab === t.id ? " active" : "")}
                  onClick={() => setTab(t.id)}
                >
                  <TabIcon /> {t.label}
                </button>

          </div>

          {/* ---------------- ÖZET ---------------- */}
          {tab === "ozet" && (
            <div className="grid grid-3">

                <p className="card-title"><Flame /> Enerji Hedefi</p>

                <div className="stat-label">Günlük hedef (TDEE)</div>
                <div style={{ marginTop: 10, fontSize: 13 }}>
                  Seçili öğünler toplamı: <b className="stat-mono">{selectedMealTotals.kcal} kcal</b>
                </div>
                <div className="progress-track">
                  <div

                    style={{ width: (tdee > 0 ? Math.min(100, round((selectedMealTotals.kcal / tdee) * 100)) : 0) + "%" }}

                {bodyFatPrev && bodyFatNow && (

                      </tr>
                    </thead>
                    <tbody>
                      {REGIONS.map((region) => {
                        const count = regionCounts.find((r) => r.region === region).count;
                        return (
                          <tr key={region}>
                            <td className="region-label">{region}</td>
                            {DAYS.map((d) => {
                              const on = weeklyPlan[d].includes(region);
                              const level = on ? stampLevel(count) : 0;
                              return (
                                <td key={d}>
                                  <div
                                    className={"stamp-cell l" + level}
                                    onClick={() => toggleRegionDay(d, region)}
                                  />
                                </td>
                              );
                            })}
                            <td><span className="count-pill">{count}x</span></td>
                          </tr>
                        );
                      })}
                      <tr>
                        <td className="region-label" style={{ color: "var(--graphite)" }}>Gün toplamı</td>
                        {dayTotals.map((c, i) => (
                          <td key={i}><span className="count-pill">{c}</span></td>
                        ))}
                        <td></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="card">
                <p className="card-title"><Dumbbell /> Hareket Alternatifleri</p>
                <div className="region-tabs">
                  {REGIONS.map((r) => (
                    <div
                      key={r}
                      className={"region-chip" + (activeRegion === r ? " active" : "")}
                      onClick={() => setActiveRegion(r)}
                    >
                      {r}
                    </div>
                  ))}
                </div>
                <ul className="ex-list">
                  {EXERCISE_ALTS[activeRegion].map((ex) => <li key={ex}>{ex}</li>)}
                </ul>
              </div>
            </div>
          )}

          {/* ---------------- VÜCUT ANALİZİ ---------------- */}
          {tab === "vucut" && (
            <div className="grid grid-2">
              <div className="card">
                <p className="card-title"><User /> Profil</p>
                <div className="form-row">
                  <select className="select" value={profile.gender} onChange={(e) => setProfile({ ...profile, gender: e.target.value })}>
                    <option value="erkek">Erkek</option>
                    <option value="kadın">Kadın</option>
                  </select>
                  <input className="input" type="number" value={profile.age} onChange={(e) => setProfile({ ...profile, age: parseInt(e.target.value) || 0 })} placeholder="Yaş" />
                  <input className="input" type="number" value={profile.heightCm} onChange={(e) => setProfile({ ...profile, heightCm: parseFloat(e.target.value) || 0 })} placeholder="Boy(cm)" />
                  <select className="select" value={profile.activity} onChange={(e) => setProfile({ ...profile, activity: e.target.value })}>
                    {Object.entries(ACTIVITY_FACTORS).map(([k, v]) => (
                      <option key={k} value={k}>{v.label}</option>
                    ))}
                  </select>
                </div>

                <p className="card-title" style={{ marginTop: 16 }}>Aylık Ölçüm Ekle</p>
                <div className="form-row">
                  <input className="input" style={{ width: 80 }} placeholder="Ay" value={newLog.label} onChange={(e) => setNewLog({ ...newLog, label: e.target.value })} />
                  <input className="input" type="number" placeholder="Kilo" value={newLog.weight} onChange={(e) => setNewLog({ ...newLog, weight: e.target.value })} />
                  <input className="input" type="number" placeholder="Boyun cm" value={newLog.neck} onChange={(e) => setNewLog({ ...newLog, neck: e.target.value })} />
                  <input className="input" type="number" placeholder="Bel cm" value={newLog.waist} onChange={(e) => setNewLog({ ...newLog, waist: e.target.value })} />
                  {profile.gender === "kadın" && (
                    <input className="input" type="number" placeholder="Kalça cm" value={newLog.hip} onChange={(e) => setNewLog({ ...newLog, hip: e.target.value })} />
                  )}
                  <button className="btn red" onClick={addBodyLog}><Plus size={14} /> Ekle</button>
                </div>

                {bodyLogs.length === 0 ? (
                  <p style={{ fontSize: 13, color: "var(--graphite)" }}>Henüz ölçüm eklenmedi.</p>
                ) : (
                  <div className="table-scroll">
                    <table className="log-table">
                      <thead>
                        <tr><th>Ay</th><th>Kilo</th><th>Boyun</th><th>Bel</th><th>Yağ %</th></tr>
                      </thead>
                      <tbody>
                        {bodyLogs.map((log) => {
                          const bf = computeBodyFat(profile.gender, log.neck, log.waist, log.hip, profile.heightCm);
                          return (
                            <tr key={log.id}>
                              <td>{log.label}</td>
                              <td className="stat-mono">{log.weight}</td>
                              <td className="stat-mono">{log.neck}</td>
                              <td className="stat-mono">{log.waist}</td>
                              <td className="stat-mono">{bf ? round(bf, 1) + "%" : "—"}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              <div className="card">
                <p className="card-title"><Flame /> Bazal Metabolizma & Hedefler</p>
                <div className="grid grid-2" style={{ marginBottom: 12 }}>
                  <div>
                    <div className="stat-label">BMR</div>
                    <div className="stat-mono stat-big">{round(bmr)}</div>
                  </div>
                  <div>
                    <div className="stat-label">TDEE</div>
                    <div className="stat-mono stat-big">{round(tdee)}</div>
                  </div>
                </div>

                <p className="card-title">Makro Hedefleri</p>
                <MacroBars target={macros} selected={null} />

                <p className="card-title" style={{ marginTop: 14 }}>Mikro Besin Referansları</p>
                <div className="micro-grid">
                  {MICROS.map((m) => (
                    <div className="micro-row" key={m.name}><span>{m.name}</span><span>{m.target}</span></div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ---------------- BESLENME ---------------- */}
          {tab === "beslenme" && (
            <div className="grid grid-2">
              <div className="card" style={{ gridColumn: "span 2" }}>
                <p className="card-title"><Utensils /> Günlük Öğün Planı — Alternatiflerden Seç</p>
                <div className="grid grid-2">
                  {Object.entries(MEALS).map(([slot, options]) => (
                    <div key={slot}>
                      <p style={{ fontFamily: "'Oswald',sans-serif", textTransform: "uppercase", fontSize: 13, fontWeight: 600, marginBottom: 6 }}>{slot}</p>
                      {options.map((opt, idx) => (
                        <div
                          key={opt.name}
                          className={"meal-card" + (mealSelections[slot] === idx ? " selected" : "")}
                          onClick={() => setMealSelections({ ...mealSelections, [slot]: idx })}
                        >
                          <div>
                            <div className="meal-name">{opt.name}</div>
                            <div className="meal-macros">{opt.kcal} kcal · P{opt.p} K{opt.c} Y{opt.f}</div>
                          </div>
                          {mealSelections[slot] === idx && <Check size={16} color="var(--turf)" />}
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </div>

              <div className="card">
                <p className="card-title"><Flame /> Günlük Toplam vs Hedef</p>
                <MacroBars target={macros} selected={selectedMealTotals} />
                <div style={{ marginTop: 8, fontSize: 13 }}>
                  Toplam alım: <b className="stat-mono">{selectedMealTotals.kcal} kcal</b> / Hedef: <b className="stat-mono">{round(tdee)} kcal</b>
                </div>
              </div>

              <div className="card">
                <p className="card-title"><Check /> Supplement Takibi (Haftalık)</p>
                <div className="table-scroll">
                  <table className="supp-table">
                    <thead>
                      <tr><th></th>{DAYS.map((d) => <th key={d}>{d}</th>)}</tr>
                    </thead>
                    <tbody>
                      {SUPPLEMENTS.map((sup) => (
                        <tr key={sup}>
                          <td className="supp-name">{sup}</td>
                          {DAYS.map((d) => {
                            const on = supplementLog[sup].includes(d);
                            return (
                              <td key={d}>
                                <div className={"supp-cell" + (on ? " on" : "")} onClick={() => toggleSupplementDay(sup, d)}>
                                  {on && <Check />}
                                </div>
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ---------------- CARDIO ---------------- */}
          {tab === "cardio" && (
            <div className="grid grid-2">
              <div className="card">
                <p className="card-title"><Activity /> Cardio Seansı Ekle</p>
                <div className="form-row">
                  <select className="select" value={newCardio.day} onChange={(e) => setNewCardio({ ...newCardio, day: e.target.value })}>
                    {DAYS.map((d) => <option key={d} value={d}>{d}</option>)}
                  </select>
                  <select className="select" value={newCardio.type} onChange={(e) => setNewCardio({ ...newCardio, type: e.target.value })}>
                    {Object.keys(CARDIO_TYPES).map((t) => <option key={t} value={t}>{t}</option>)}
                  </select>
                  <input className="input" type="number" value={newCardio.minutes} onChange={(e) => setNewCardio({ ...newCardio, minutes: e.target.value })} placeholder="Dakika" />
                  <button className="btn red" onClick={addCardio}><Plus size={14} /> Ekle</button>
                </div>

                {cardioWithCalories.length === 0 ? (
                  <p style={{ fontSize: 13, color: "var(--graphite)" }}>Bu hafta henüz cardio eklenmedi.</p>
                ) : (
                  cardioWithCalories.map((s) => (
                    <div className="cardio-item" key={s.id}>
                      <span>{s.day} · {s.type} · {s.minutes} dk</span>
                      <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <b className="stat-mono">{s.kcal} kcal</b>
                        <X size={14} style={{ cursor: "pointer" }} onClick={() => removeCardio(s.id)} />
                      </span>
                    </div>
                  ))
                )}
              </div>

              <div className="card">
                <p className="card-title"><Flame /> Haftalık Hedef</p>
                <div className="form-row">
                  <span style={{ fontSize: 13 }}>Hedef (kcal/hafta):</span>
                  <input className="input" type="number" value={cardioGoal} onChange={(e) => setCardioGoal(parseInt(e.target.value) || 0)} />
                </div>
                <div className="stat-mono stat-big">{cardioWeekTotal} / {cardioGoal} kcal</div>
                <div className="progress-track">
                  <div className="progress-fill" style={{ width: cardioPct + "%" }} />
                </div>
                <div style={{ fontSize: 12.5, color: "var(--graphite)", marginTop: 10 }}>
                  Kalori hesabı MET değeri ile tahmini yapılır: MET × 3.5 × kilo(kg) / 200 × dakika. Kilo, en güncel vücut analizi ölçümünden alınır ({weightKgForCardio} kg).
                </div>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Alt bileşenler                                                       */
/* ------------------------------------------------------------------ */

function RegionHeatmapMini({ weeklyPlan, regionCounts }) {
  function level(count) {
    if (count === 0) return 0;
    if (count === 1) return 1;
    if (count === 2) return 2;
    return 3;
  }
  return (
    <table className="stamp-table">
      <thead>
        <tr><th></th>{DAYS.map((d) => <th key={d}>{d}</th>)}</tr>
      </thead>
      <tbody>
        {regionCounts.map(({ region, count }) => (
          <tr key={region}>
            <td className="region-label">{region}</td>
            {DAYS.map((d) => {
              const on = weeklyPlan[d].includes(region);
              return (
                <td key={d}>
                  <div className={"stamp-cell l" + (on ? level(count) : 0)} style={{ width: 22, height: 20 }} />
                </td>
              );
            })}
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function MacroBars({ target, selected }) {
  const rows = [
    { label: "Protein", key: "p", targetVal: target.proteinG, color: "var(--track-red)" },
    { label: "Karbonhidrat", key: "c", targetVal: target.carbG, color: "var(--amber)" },
    { label: "Yağ", key: "f", targetVal: target.fatG, color: "var(--turf)" },
  ];
  return (
    <div>
      {rows.map((r) => {
        const selVal = selected ? (r.key === "p" ? selected.p : r.key === "c" ? selected.c : selected.f) : null;
        const pct = selected ? (r.targetVal > 0 ? Math.min(100, round((selVal / r.targetVal) * 100)) : 0) : 100;
        return (
          <div className="macro-bar-row" key={r.label}>
            <div className="macro-bar-label">
              <span>{r.label}</span>
              <span className="stat-mono">
                {selected ? `${round(selVal)} / ${round(r.targetVal)} g` : `${round(r.targetVal)} g`}
              </span>
            </div>
            <div className="progress-track" style={{ height: 10 }}>
              <div className="progress-fill" style={{ width: pct + "%", background: r.color }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SporcuApp />);

</script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
</script>
